general:
  # Commands to run when the WM has started.
  startup_commands:
    - 'shell-exec zebar'
    # Uncomment below to auto-launch Windows Terminal on startup:
    # - 'shell-exec wt'

  # Commands to run just before the WM is shutdown.
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # ✨ HOVER TRANSPARENCY: Hovering a window auto-focuses it → triggers opacity change.
  # Focused = 100% opaque, Unfocused = transparent. Move cursor = instant effect.
  focus_follows_cursor: true

  # Toggle back/forth between previously focused workspace on refocus.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # DISABLED: Would fight the hover effect by teleporting cursor back to focused window.
    enabled: false
    trigger: 'monitor_focus'

  # ✅ UPGRADED: 'cloak' is recommended on Windows 11 — fixes ghost app bugs.
  hide_method: 'cloak'

  # Show all windows in native taskbar regardless of workspace.
  show_all_in_taskbar: true

gaps:
  # Scale gaps with DPI for multi-monitor setups.
  scale_with_dpi: true

  # Gap between adjacent windows. Tighter for more usable space.
  inner_gap: '12px'

  # Gap between windows and the screen edge.
  outer_gap:
    top: '60px'     # Space for Zebar
    right: '16px'
    bottom: '16px'
    left: '16px'

window_effects:
  # Visual effects for the focused (active) window.
  focused_window:
    border:
      enabled: true
      # 🎨 Electric cyan accent — highly visible, modern feel
      color: '#115555'

    hide_title_bar:
      enabled: false

    # ✨ FEATURE: Rounded corners for a modern macOS-inspired look (Windows 11 only)
    corner_style:
      enabled: true
      style: 'rounded'

    transparency:
      enabled: true
      # Focused windows are fully opaque — sharp and clear
      opacity: '100%'

  # Visual effects for non-focused (background) windows.
  other_windows:
    border:
      enabled: true
      # Subtle dim border for unfocused windows
      color: '#141414'

    hide_title_bar:
      enabled: false

    corner_style:
      enabled: true
      style: 'rounded'

    transparency:
      enabled: true
      # 🌊 HOVER EFFECT: Background windows are clearly translucent.
      # Moving cursor over any window makes it jump to 100% instantly.
      opacity: '85%'

window_behavior:
  # New windows open as tiling by default.
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: false

    fullscreen:
      maximized: false
      shown_on_top: false

# 🏷️ FEATURE: Named workspaces with purpose labels
workspaces:
  - name: '1'
    display_name: '󰆍 1 lolita'
    keep_alive: true      # Always exists, even when empty
  - name: '2'
    display_name: '󰈹 2 Web'
  - name: '3'
    display_name: '󰨞 3 Code'
  - name: '4'
    display_name: '󰭹 4 Chat'
  - name: '5'
    display_name: '󰎄 5 Music'
  - name: '6'
    display_name: '󰢔 6 Files'
  - name: '7'
    display_name: '󰃣 7 Docs'
  - name: '8'
    display_name: '󰊴 8 Game'
  - name: '9'
    display_name: '󰐽 9 Media'

window_rules:
  # ─── Core Ignore Rules ─────────────────────────────────────────────────────
  - commands: ['ignore']
    match:
      # Ignore Zebar bar windows
      - window_process: { equals: 'zebar' }

      # Fix for invisible ghost apps and Windows 11 system overlays stealing focus
      - window_process: { regex: 'SearchHost|StartMenuExperienceHost|ShellExperienceHost|TextInputHost|ScreenClippingHost' }
      - window_class: { regex: 'WorkerW|Progman' }
      - window_title: { regex: 'Program Manager' }
      - window_process: { regex: 'NVIDIA Share|nvsphelper64|XboxGameBarWidgets|GameBar' }

      # Ignore picture-in-picture browser windows
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # PowerToys utilities
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }

      # Lively Wallpaper
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }

      # Office apps — only tile the main window
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # ─── 🚀 FEATURE: Auto-float utility/dialog windows (idempotent set-floating) ──
  - commands: ['set-floating --centered']
    match:
      - window_title: { regex: '(?i)(Open|Save As|Save File|Choose File|Browse|Select Folder|Export|Import)' }
      - window_process: { equals: 'CalculatorApp' }
      - window_process: { equals: 'SnippingTool' }
      - window_title: { regex: '(?i)(Settings|Preferences|Options|Properties)' }
      - window_class: { regex: '#32770' }   # Common dialog class

  # ─── 🚀 FEATURE: Auto-assign browsers to workspace 2 ──────────────────────
  - commands: ['move --workspace 2']
    match:
      - window_process: { regex: '(?i)^(chrome|msedge|firefox|brave|vivaldi|opera|zen)$' }

  # ─── 🚀 FEATURE: Auto-assign code editors to workspace 3 ──────────────────
  - commands: ['move --workspace 3']
    match:
      - window_process: { regex: '(?i)^(Code|code|Antigravity IDE|antigravity|Cursor|cursor|zed|rider64|idea64|webstorm64|pycharm64|devenv|sublime_text)$' }

  # ─── 🚀 FEATURE: Auto-assign chat apps to workspace 4 ─────────────────────
  - commands: ['move --workspace 4']
    match:
      - window_process: { regex: '(?i)^(Discord|Slack|Teams|telegram)$' }

  # ─── 🚀 FEATURE: Auto-assign music to workspace 5 ─────────────────────────
  - commands: ['move --workspace 5']
    match:
      - window_process: { regex: '(?i)^(Spotify)$' }

  # ─── 🚀 FEATURE: Auto-assign file explorer to workspace 6 ─────────────────
  - commands: ['move --workspace 6']
    match:
      - window_process: { equals: 'explorer' }
        window_class: { equals: 'CabinetWClass' }

  # ─── 🚀 FEATURE: Auto-assign Office to workspace 7 ────────────────────────
  - commands: ['move --workspace 7']
    match:
      - window_process: { regex: '^(EXCEL|WINWORD|POWERPNT|ONENOTE)$' }

binding_modes:
  # ─── Resize Mode ────────────────────────────────────────────────────────────
  - name: 'resize'
    keybindings:
      # Standard resize (2% steps)
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      # 🚀 FEATURE: Fine-grained resize (1% steps with shift)
      - commands: ['resize --width -1%']
        bindings: ['shift+h', 'shift+left']
      - commands: ['resize --width +1%']
        bindings: ['shift+l', 'shift+right']
      - commands: ['resize --height +1%']
        bindings: ['shift+k', 'shift+up']
      - commands: ['resize --height -1%']
        bindings: ['shift+j', 'shift+down']
      # Exit resize mode
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

  # ─── 🚀 FEATURE: App Launch Mode (alt+shift+o → key) ───────────────────────
  - name: 'launch'
    keybindings:
      # t = terminal
      - commands: ['shell-exec wt', 'wm-disable-binding-mode --name launch']
        bindings: ['t']
      # b = browser (Brave)
      - commands: ['shell-exec cmd /c start brave', 'wm-disable-binding-mode --name launch']
        bindings: ['b']
      # c = code editor
      - commands: ['shell-exec code', 'wm-disable-binding-mode --name launch']
        bindings: ['c']
      # e = explorer
      - commands: ['shell-exec explorer', 'wm-disable-binding-mode --name launch']
        bindings: ['e']
      # s = spotify
      - commands: ['shell-exec cmd /c start spotify:', 'wm-disable-binding-mode --name launch']
        bindings: ['s']
      # d = discord
      - commands: ['shell-exec cmd /c start discord:', 'wm-disable-binding-mode --name launch']
        bindings: ['d']
      # n = notepad
      - commands: ['shell-exec notepad', 'wm-disable-binding-mode --name launch']
        bindings: ['n']
      # Escape to cancel
      - commands: ['wm-disable-binding-mode --name launch']
        bindings: ['escape', 'enter']

keybindings:
  # ─── Focus Navigation (Vim + Arrow Keys) ────────────────────────────────────
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # ─── Move Windows ────────────────────────────────────────────────────────────
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # ─── Resize Shortcuts ────────────────────────────────────────────────────────
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # Enter resize mode
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # ─── 🚀 FEATURE: Enter launch mode ──────────────────────────────────────────
  # Press alt+shift+o then a key (t/b/c/e/s/d/n) to launch an app
  - commands: ['wm-enable-binding-mode --name launch']
    bindings: ['alt+shift+o']

  # ─── Window Management ───────────────────────────────────────────────────────
  # Pause/unpause WM
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Toggle tiling direction (horizontal/vertical split)
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # Cycle focus through tiling → floating → fullscreen
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Toggle floating (centered)
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Toggle tiling mode
  - commands: ['toggle-tiling']
    bindings: ['alt+t']

  # Toggle fullscreen
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']

  # Minimize window
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close window
  - commands: ['close']
    bindings: ['alt+shift+q']

  # ─── WM Control ──────────────────────────────────────────────────────────────
  # Safely exit GlazeWM
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # Reload config
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # Redraw all windows
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # ─── 🚀 UPGRADED: Launch Windows Terminal (modern, tabbed) ───────────────────
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # ─── Workspace Navigation ────────────────────────────────────────────────────
  # Next/previous active workspace
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']

  # Most recently focused workspace (toggle back/forth)
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  # Focus next monitor (across monitors)
  - commands: ['focus --direction right']
    bindings: ['alt+oem_tilde']

  # Direct workspace focus (alt+1 through alt+9)
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # ─── Move Workspace Between Monitors ─────────────────────────────────────────
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']

  # ─── Move Window to Workspace (and follow it) ────────────────────────────────
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
